[package]
name = "sprite-movie"
version = "0.1.0"
edition = "2018"
description = "SWIRL: Progressive demo for the SpriteMovie component"
authors = ["Alexander Feterman-Naranjo <10951848+CubOfJudahsLion@users.noreply.github.com>"]
keywords = ["SWIRL", "WebAssembly", "SpriteMovie", "sprite movie", "movie", "component"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "~0.2.78"
js-sys = "~0.3.55"
wasm-bindgen-futures = "~0.4.28"
wasm-bindgen-test = "~0.3.28"
swirl = { path = "../../swirl" }

[dependencies.web-sys]
version = "~0.3.55"
features =  [ "console"
            , "CanvasRenderingContext2d"
            , "Document"
            , "HtmlCanvasElement"
            , "HtmlElement"
            , "HtmlImageElement"
            , "Window"
            ]