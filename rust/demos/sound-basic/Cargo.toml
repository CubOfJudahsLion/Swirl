[package]
name = "sound-basic"
version = "0.1.0"
edition = "2018"
description = "A basic sound capabilities demo for SWIRL."
license-file = "LICENSE.md"
publish = false
repository = "http://multidev:7990/scm/dev/gameengines.git"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "~0.2.78"
js-sys = "~0.3.55"
wasm-bindgen-futures = "~0.4.28"
futures = "~0.3.17"
swirl = { path = "../../swirl" }

[dependencies.web-sys]
version = "~0.3.55"
features =  [ "console"
            , "CssStyleDeclaration"
            , "Document"
            , "DocumentFragment"
            , "Element"
            , "HtmlAudioElement"
            , "HtmlButtonElement"
            , "HtmlElement"
            , "HtmlInputElement"
            , "HtmlOptionElement"
            , "HtmlOptionsCollection"
            , "HtmlSelectElement"
            , "HtmlTemplateElement"
            , "Node"
            , "Window"
            ]
