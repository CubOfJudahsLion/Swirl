[package]
name = "gel-chinese-pantheon"
version = "0.1.0"
edition = "2021"
description = "A bare-bones demo of SWIRL's interface to GEL"
license-file = "LICENSE"
keywords = ["gel", "interface", "demo", "chinese", "gods", "pantheon", "mythology"]
publish = false

[lib]
crate-type = ["cdylib"]

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "packed"


[profile.release]
strip = true
lto = true

[dependencies]
wasm-bindgen = "~0.2.78"
js-sys = "~0.3.55"
swirl = { path = "../../swirl" }
wasm-bindgen-futures = "~0.4.28"

[dependencies.web-sys]
version = "~0.3.55"
features =  [ "console"
            , "HtmlCanvasElement"
            , "HtmlDivElement"
            , "HtmlImageElement"
            , "HtmlLabelElement"
            , "Window"
            ]
