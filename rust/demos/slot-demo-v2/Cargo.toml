[package]
name = "slot-demo"
version = "0.2.0"
authors = ["Alexander Feterman-Naranjo <10951848+CubOfJudahsLion@users.noreply.github.com>"]
edition = "2018"
description = "A prototype/demo for a slots machine using our Rust+WASM-based SWIRL library"
repository = "http://multidev:7990/scm/dev/gameengines.git"
license-file = "LICENSE.txt"
readme = "README.pdf"
keywords = ["slots", "demo", "WASM", "webassembly"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swirl = {path = "../../swirl"}
wasm-bindgen = "~0.2.74"
js-sys = "~0.3.51"
paste = "1.0"
lazy_static = "1.4.0"

[dependencies.web-sys]
version = "~0.3.51"
features =  [ "console"
            , "CanvasRenderingContext2d"
            , "Document"
            , "DomRect"
            , "Element"
            , "Event"
            , "EventTarget"
            , "HtmlAudioElement"
            , "HtmlCanvasElement"
            , "HtmlDivElement"
            , "HtmlElement"
            , "HtmlHeadElement"
            , "HtmlImageElement"
            , "HtmlIFrameElement"
            , "HtmlLabelElement"
            , "HtmlStyleElement"
            , "Window"
            ]
