[package]
name = "slot-demo"
version = "0.1.1"
authors = ["Alexander Feterman-Naranjo <10951848+CubOfJudahsLion@users.noreply.github.com>"]
edition = "2018"
description = "A prototype/demo for a slots machine using our Rust+WASM-based SWIRL library"
repository = "http://gitserver:7990/scm/dev/gameengines.git"
license-file = "LICENSE.txt"
keywords = ["slots", "demo", "WASM", "webassembly"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swirl = {path = "../../swirl"}
wasm-bindgen = "~0.2.74"
js-sys = "~0.3.51"

[dependencies.web-sys]
version = "~0.3.51"
features =  [ "console"
            , "CanvasGradient"
            , "CanvasPattern"
            , "CanvasRenderingContext2d"
            , "CssStyleDeclaration"
            , "Document"
            , "DomRect"
            , "Element"
            , "Event"
            , "EventTarget"
            , "HtmlCanvasElement"
            , "HtmlElement"
            , "HtmlHeadElement"
            , "HtmlImageElement"
            , "HtmlLabelElement"
            , "HtmlStyleElement"
            , "ImageData"
            , "MouseEvent"
            , "TextMetrics"
            , "Touch"
            , "TouchEvent"
            , "TouchList"
            , "Window"
            , "XmlHttpRequest"
            , "XmlHttpRequestResponseType"
            ]
