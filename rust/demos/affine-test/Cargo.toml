[package]
name = "affine-test"
version = "0.1.0"
edition = "2018"
authors = ["Alexander Feterman-Naranjo <10951848+CubOfJudahsLion@users.noreply.github.com>"]
repository = "http://gitserver:7990/scm/dev/gameengines.git"
keywords = ["library", "scene-graph", "graphics", "webassembly"]
description = "Tests affine transformation at a somewhat basic level."
license = "LICENSE.txt"

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "~0.2.78"
js-sys = "~0.3.55"
wasm-bindgen-futures = "~0.4.28"
wasm-bindgen-test = "~0.3.28"
swirl = { path = "../../swirl" }

[dependencies.web-sys]
version = "~0.3.55"
features =  [ "CanvasPattern"
            , "CanvasRenderingContext2d"
            , "console"
            , "Document"
            , "HtmlCanvasElement"
            , "Window"
            ]
