[package]
name = "c-and-rust"
version = "0.1.0"
edition = "2021"
description = "An attempt to communicate Rust and C in the wasm32-unknown-unknown target."
keywords = ["ffi", "c", "rust", "wasm32"]
license-file = "LICENSE.txt"
bench = false
test = false
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "^0.2.79"
js-sys = "^0.3.56"

[dependencies.web-sys]
version = "^0.3.56"
features = [  "console"
           ]
